name: uplift_reconnect
description: Control Uplift standing desks that have the Uplift Connect BLE dongle installed.
publish_to: none

version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DeskIcon
      fonts:
        - asset: fonts/DeskIcon.ttf
